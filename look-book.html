<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Look book | Material Rebellion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Gelasio:wght@500&family=Schoolbell&family=Libre+Caslon+Condensed&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#000;--mute:#4a453f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;background:#fff}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Playfair Display",Georgia,serif;line-height:1.7;font-size:17px}
a{color:inherit}:focus-visible{outline:3px solid #000;outline-offset:3px}
header.top{text-align:center;padding:14px 24px 0}
header.top img{width:58px;height:auto;display:block;margin:0 auto 22px}
nav ul{display:flex;justify-content:center;gap:12px 24px;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
nav a{text-decoration:none;padding-bottom:4px;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current]{border-color:#000}
.intro{max-width:560px;margin:64px auto 56px;padding:0 24px;text-align:center}
h1{font-family:'Schoolbell',cursive;font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.05;margin:0 0 20px;-webkit-text-stroke:1px var(--bg);text-wrap:balance}
.intro p{font-family:'Libre Caslon Condensed',Georgia,serif;font-size:clamp(1rem,1.9vw,1.15rem);line-height:1.75;color:#333;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1000px;margin:0 auto;padding:0 24px 80px}
.card{background:var(--card);border:1px solid #e6e6e6;display:flex;flex-direction:column;text-align:center}
.card h3{font-family:'Schoolbell',cursive;font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(1.1rem,2vw,1.4rem);line-height:1.15;margin:0;padding:18px 12px;-webkit-text-stroke:.7px var(--card)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card p{font-family:'Libre Caslon Condensed',Georgia,serif;font-size:.98rem;line-height:1.7;color:#333;margin:0;padding:22px 22px 26px}
.cta{text-align:center;padding:0 24px 72px}
.btn{font:inherit;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;padding:14px 26px;border:1px solid #000;background:#000;color:#fff;text-decoration:none;display:inline-block}
.btn:hover{background:transparent;color:#000}
footer{padding:40px 24px 48px;text-align:center;font-size:.8rem;letter-spacing:.08em;color:var(--mute)}
.social{display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap;margin-bottom:22px}
.social a{text-decoration:none;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#000}
.social a:hover{text-decoration:underline}
.mark{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#000;margin-bottom:4px}
@media(max-width:820px){.grid{grid-template-columns:1fr;max-width:440px}}
@media(min-width:821px) and (max-width:960px){.card p{font-size:.9rem;padding:18px 16px 22px}}

.page{max-width:1000px;margin:56px auto 72px;padding:0 24px}
.page h1{text-align:center;margin:0 0 12px}
.eyebrow{font-family:'Libre Caslon Condensed',Georgia,serif;font-size:.95rem;color:#4a453f;text-align:center;margin:0 0 10px}
.lead{max-width:560px;margin:0 auto 12px;text-align:center;font-family:'Libre Caslon Condensed',Georgia,serif;font-size:clamp(1rem,1.9vw,1.15rem);line-height:1.75;color:#333}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-top:40px}
.split img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.split .t{font-family:'Libre Caslon Condensed',Georgia,serif;font-size:1.05rem;line-height:1.75;color:#333}
.facts{list-style:none;margin:18px 0 26px;padding:0}
.facts li{padding:10px 0;border-top:1px solid #e6e6e6}
.facts li:last-child{border-bottom:1px solid #e6e6e6}
.soon{text-align:center;margin-top:36px}
.enq{max-width:460px;margin:32px auto 0;display:grid;gap:18px}
.enq label{display:block;font-family:'Libre Caslon Condensed',Georgia,serif;font-size:.95rem;color:#333}
.enq label em{color:#777}
.enq input,.enq select,.enq textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:1rem;padding:10px 4px;border:0;border-bottom:1px solid #bbb;background:transparent;color:#000;border-radius:0}
.enq textarea{border:1px solid #ccc;padding:10px;resize:vertical}
.enq .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.enq button{justify-self:start;font:inherit;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;padding:14px 30px;border:1px solid #000;background:#000;color:#fff;cursor:pointer;border-radius:0}
.enq button:hover{background:transparent;color:#000}
.note{min-height:1.6em;font-size:.9rem;color:#4a453f;margin:0}
@media(max-width:720px){.split{grid-template-columns:1fr;gap:24px}.enq .two{grid-template-columns:1fr}}

nav.menu{position:relative;display:flex;justify-content:center;padding-bottom:6px}
.menu-btn{font:inherit;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid #000;padding:2px 2px 4px;color:#000;cursor:pointer;border-radius:0}
.menu-btn .caret{display:inline-block;margin-left:.55em;font-size:.7em;transition:transform .2s}
.menu-btn[aria-expanded="true"] .caret{transform:rotate(180deg)}
nav.menu ul{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);z-index:50;flex-direction:column;flex-wrap:nowrap;gap:0;min-width:240px;margin:10px 0 0;padding:8px 0;background:#fff;border:1px solid #e6e6e6;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center}
nav.menu ul.open{display:flex}
nav.menu li a{display:block;padding:11px 24px;border:0;white-space:nowrap}
nav.menu li a:hover,nav.menu li a[aria-current]{background:#f4f4f4;border:0}

.menu-btn{border-bottom:0;padding:4px 6px}
.menu-btn .menu-logo{width:min(640px,calc(100vw - 56px));height:auto;display:inline-block;vertical-align:middle}
.menu-btn .caret{vertical-align:middle;margin-left:.5em;font-size:.8rem}
.menu-btn:focus-visible{outline:3px solid #000;outline-offset:4px}

.menu-btn{display:flex;flex-direction:column;align-items:center;gap:6px}
.menu-btn .arrow{width:19px;height:23px;display:block;transition:transform .2s}
.menu-btn[aria-expanded="true"] .arrow{transform:rotate(180deg)}
.ticker{overflow:hidden;margin:0 -24px 28px;border-top:1px solid #d42d2a;border-bottom:1px solid #d42d2a;padding:6px 0;white-space:nowrap}
.ticker-track{display:flex;width:max-content;animation:tick 32s linear infinite}
.ticker-set{display:flex;flex:none}
.ticker-set span{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#d42d2a;padding:0 22px;position:relative}
.ticker-set span::after{content:"";position:absolute;right:-2px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:#d42d2a}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}
</style><style id="gloock">h1,h2,.panel h3,.card h3,.tcard h3,.row h2{font-family:"Gelasio",Georgia,serif!important;font-weight:500!important;-webkit-text-stroke:0!important;letter-spacing:-.02em!important;text-transform:none!important;line-height:1.08!important}</style>
<style id="lbphotocss">.lbphoto{display:block;width:min(520px,100%);height:auto;margin:36px auto 8px}</style>
<style id="cream">:root{--bg:#fbf7ee!important;--panel:#fbf7ee!important;--card:#fbf7ee!important}html,body{background:#fbf7ee!important}header.top,nav.menu ul,#site-menu{background-color:#fbf7ee}.menu-trigger{background-color:transparent}</style>
<style id="nowordmark">header.top{position:relative;padding-bottom:6px}nav.menu{position:static;padding:0;height:0}
.menu-btn .menu-logo,.menu-btn .arrow{display:none!important}
.menu-btn{position:absolute;left:24px;top:22px;width:34px;height:26px;padding:0!important;border:0;background:linear-gradient(#000,#000) 0 0/100% 2px no-repeat,linear-gradient(#000,#000) 0 50%/100% 2px no-repeat,linear-gradient(#000,#000) 0 100%/100% 2px no-repeat!important;cursor:pointer;gap:0}
nav.menu ul{top:110px!important;margin:0!important}
header.top>a img{width:96px!important;margin-bottom:12px!important}</style>
